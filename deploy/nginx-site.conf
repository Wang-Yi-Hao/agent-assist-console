# Nginx site for the static deployment (server_name 按你的域名/IP 调整)
# - /aac/                     : agent-assist-console static SPA
# - 其它路径                   : 保持服务器原有站点不变
#
# The SPA uses hash routing and Vite base './', so no try_files fallback is needed.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/keep-screen;
    index index.html index.htm;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
    }

    location = /aac {
        return 301 /aac/;
    }

    location ^~ /aac/ {
        alias /var/www/aac/;
        index index.html;
        autoindex off;
        add_header Cache-Control "no-cache" always;
    }
}
